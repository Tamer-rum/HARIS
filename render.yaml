services:
  - type: web
    name: haris-api
    runtime: python
    # Phase 11 release contract: process-local dispatch and rate limiting.
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    # run_api.py also pins uvicorn workers=1; do not replace with a multi-worker command.
    startCommand: python run_api.py
    healthCheckPath: /api/platform/health
    envVars:
      - key: HARIS_RUNTIME_ENV
        value: production
      - key: HARIS_PERSISTENCE_MODE
        value: postgres
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: HARIS_OPERATIONAL_API_TOKEN
        sync: false
      - key: NAC_MODE
        value: live_read_only
      - key: NOKIA_OBSERVATION_ENABLED
        value: "true"
      - key: NOKIA_CONGESTION_INTERVAL_SECONDS
        value: "30"
      - key: NOKIA_REACHABILITY_INTERVAL_SECONDS
        value: "60"
      - key: NOKIA_LOCATION_INTERVAL_SECONDS
        value: "180"
      - key: NOKIA_OBSERVATION_TIMEOUT_SECONDS
        value: "2"
      - key: NOKIA_OBSERVATION_MAX_BACKOFF_SECONDS
        value: "60"
      - key: ENABLE_CONTINUOUS_LOOP
        value: "false"
      - key: ENABLE_LIVE_WRITE_LOOP
        value: "false"
